<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1240"/>
      <stop offset="0.36" stop-color="#55296a"/>
      <stop offset="0.6" stop-color="#c94f6c"/>
      <stop offset="0.78" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#ffc77c"/>
    </linearGradient>
    <radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe2"/>
      <stop offset="0.6" stop-color="#ffda7a"/>
      <stop offset="1" stop-color="#ffaa55"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27e" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ff9c6a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9c6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56743f"/>
      <stop offset="1" stop-color="#2a4230"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e6330"/>
      <stop offset="1" stop-color="#14231a"/>
    </linearGradient>
    <pattern id="crops" width="34" height="22" patternUnits="userSpaceOnUse">
      <path d="M17 19 q-6 -9 -11 -7 q6 1 11 7 q4 -10 10 -9 q-7 2 -10 9z" fill="#86b94c"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>

  <!-- 별 -->
  <g fill="#fff">
    <circle cx="140" cy="60" r="1.6" opacity=".8"/><circle cx="310" cy="120" r="1.2" opacity=".6"/>
    <circle cx="520" cy="48" r="1.8" opacity=".8"/><circle cx="690" cy="140" r="1.1" opacity=".5"/>
    <circle cx="860" cy="70" r="1.5" opacity=".7"/><circle cx="1030" cy="36" r="1.2" opacity=".6"/>
    <circle cx="1240" cy="90" r="1.7" opacity=".7"/><circle cx="1420" cy="54" r="1.3" opacity=".6"/>
    <circle cx="1530" cy="150" r="1.1" opacity=".5"/><circle cx="420" cy="190" r="1" opacity=".4"/>
  </g>

  <!-- 해 -->
  <circle cx="1120" cy="470" r="430" fill="url(#sunGlow)"/>
  <circle cx="1120" cy="470" r="106" fill="url(#sunCore)"/>

  <!-- 구름 -->
  <g fill="#ffb8a0" opacity=".45" filter="url(#soft)">
    <ellipse cx="900" cy="300" rx="170" ry="15"/>
    <ellipse cx="985" cy="284" rx="90" ry="11"/>
    <ellipse cx="1360" cy="342" rx="200" ry="13"/>

    <rect x="54" y="2" width="16" height="14" fill="#ffd27a"/>
    <rect x="12" y="40" width="18" height="14" fill="#ffd27a" opacity=".9"/>
    <rect x="94" y="40" width="18" height="14" fill="#ffd27a" opacity=".9"/>

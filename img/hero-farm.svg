    <path d="M940 762 l5 -24 l5 24z"/><path d="M1180 764 l6 -26 l4 26z"/><path d="M1420 756 l5 -24 l5 24z"/>
  </g>

  <!-- 반딧불 -->
  <g fill="#fff4a8">
    <g filter="url(#glow)" opacity=".9">
      <circle cx="980" cy="690" r="5"/><circle cx="1210" cy="720" r="4"/><circle cx="1380" cy="680" r="5"/>
      <circle cx="1490" cy="730" r="4"/><circle cx="1080" cy="740" r="4"/><circle cx="1300" cy="756" r="5"/>
    </g>
    <circle cx="980" cy="690" r="2"/><circle cx="1210" cy="720" r="1.6"/><circle cx="1380" cy="680" r="2"/>
    <circle cx="1490" cy="730" r="1.6"/><circle cx="1080" cy="740" r="1.6"/><circle cx="1300" cy="756" r="2"/>

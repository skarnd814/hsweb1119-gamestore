  <!-- 오른쪽 큰 나무 -->
  <g fill="#1d3022">
    <rect x="1534" y="500" width="14" height="70"/>
    <circle cx="1540" cy="476" r="46"/><circle cx="1508" cy="500" r="30"/>
    <circle cx="1574" cy="498" r="32"/><circle cx="1540" cy="440" r="30"/>

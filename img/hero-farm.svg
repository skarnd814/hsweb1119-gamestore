    <rect x="976" y="603" width="8" height="52"/><rect x="1036" y="607" width="8" height="52"/>
    <rect x="1096" y="610" width="8" height="52"/><rect x="1156" y="612" width="8" height="52"/>
    <rect x="1216" y="613" width="8" height="52"/><rect x="1276" y="612" width="8" height="52"/>
    <rect x="1336" y="610" width="8" height="52"/><rect x="1396" y="606" width="8" height="52"/>
    <rect x="1456" y="600" width="8" height="52"/><rect x="1516" y="592" width="8" height="52"/>
    <rect x="1576" y="585" width="8" height="52"/>
  </g>
  <g fill="none" stroke="#1a120f" stroke-width="5">
    <polyline points="860,604 920,609 980,613 1040,617 1100,620 1160,622 1220,623 1280,622 1340,620 1400,616 1460,610 1520,602 1580,595"/>
    <polyline points="860,622 920,627 980,631 1040,635 1100,638 1160,640 1220,641 1280,640 1340,638 1400,634 1460,628 1520,620 1580,613"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02050d"/>
      <stop offset="0.55" stop-color="#0a1d36"/>
      <stop offset="1" stop-color="#0e2b4a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4ecff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#c4ecff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6fdff"/>
      <stop offset="0.45" stop-color="#45d4f2"/>
      <stop offset="1" stop-color="#1550a2"/>
    </linearGradient>
    <linearGradient id="crystalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe9ff"/>
      <stop offset="1" stop-color="#103d80"/>
    </linearGradient>
    <radialGradient id="cglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".95"/>
      <stop offset="0.3" stop-color="#ffaf4d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.6" cy="0.55" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </radialGradient>
    <filter id="blur3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur24" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>

  <!-- 천장 틈으로 들어오는 빛 -->
  <polygon points="1010,0 1080,0 1270,800 1030,800" fill="url(#beam)" opacity=".55"/>
  <polygon points="1180,0 1212,0 1340,800 1258,800" fill="url(#beam)" opacity=".35"/>
  <polygon points="760,0 784,0 880,800 820,800" fill="url(#beam)" opacity=".18"/>

  <!-- 먼 폐허 도시 -->
  <g fill="#0f2a4a" opacity=".85">
    <path d="M560 600 V360 A80 80 0 0 1 720 360 V600 H690 V372 A50 50 0 0 0 590 372 V600Z"/>
    <rect x="740" y="300" width="40" height="300"/><polygon points="740,300 760,240 780,300"/>
    <path d="M1300 600 V330 A90 90 0 0 1 1480 330 V600 H1446 V344 A56 56 0 0 0 1334 344 V600Z"/>
    <rect x="1500" y="260" width="46" height="340"/><polygon points="1500,260 1523,190 1546,260"/>
    <rect x="460" y="420" width="70" height="180"/><polygon points="460,420 495,370 530,420"/>
    <rect x="860" y="380" width="52" height="220"/><polygon points="860,380 886,320 912,380"/>
  </g>
  <g fill="#0b2140">
    <path d="M940 640 V430 A64 64 0 0 1 1068 430 V640 H1044 V440 A40 40 0 0 0 964 440 V640Z"/>
    <rect x="1200" y="420" width="34" height="220"/>
    <rect x="1190" y="410" width="54" height="14"/>
  </g>

  <!-- 종유석 -->
  <path d="M0 0 H1600 V48 L1568 130 L1536 54 L1500 96 L1462 34 L1418 168 L1378 50 L1320 82 L1282 26 L1240 110 L1196 40 L1150 72 L1110 20 L1060 140 L1020 44 L970 70 L930 24 L880 104 L836 38 L790 60 L740 22 L690 150 L650 44 L600 80 L560 30 L510 120 L470 46 L420 70 L380 26 L330 160 L290 52 L240 86 L200 30 L150 128 L110 50 L60 76 L20 30 L0 90Z" fill="#02050c"/>

  <!-- 크리스탈 -->
  <g transform="translate(1360 652)">
    <circle cx="0" cy="-40" r="210" fill="url(#cglow)"/>
    <polygon points="-70,0 -54,-120 -30,0" fill="url(#crystalDark)"/>
    <polygon points="-36,0 -6,-200 26,0" fill="url(#crystal)"/>
    <polygon points="-6,-200 26,0 6,0" fill="#0e3d7a" opacity=".5"/>
    <polygon points="20,0 52,-140 74,0" fill="url(#crystal)"/>
    <polygon points="64,0 96,-90 112,0" fill="url(#crystalDark)"/>
    <polygon points="-110,0 -96,-60 -78,0" fill="url(#crystalDark)"/>
  </g>
  <g transform="translate(620 676)">
    <circle cx="0" cy="-20" r="110" fill="url(#cglow)" opacity=".7"/>
    <polygon points="-22,0 -4,-90 16,0" fill="url(#crystal)"/>
    <polygon points="10,0 30,-56 44,0" fill="url(#crystalDark)"/>
    <polygon points="-44,0 -34,-40 -20,0" fill="url(#crystalDark)"/>
  </g>

  <!-- 땅 -->
  <path d="M0 660 Q200 618 420 650 T860 646 Q1000 630 1120 652 T1600 648 V800 H0Z" fill="#050d1a"/>
  <path d="M0 720 Q300 690 640 712 T1260 708 T1600 700 V800 H0Z" fill="#02060e"/>

  <!-- 랜턴을 든 방랑자 -->
  <g transform="translate(1020 642)">
    <circle cx="58" cy="-58" r="110" fill="url(#lantern)"/>
    <path d="M-2 -72 C-20 -68 -30 -40 -34 0 L34 0 C30 -40 18 -68 -2 -72Z" fill="#0a111f"/>
    <path d="M-34 0 L-44 6 L-24 4Z" fill="#0a111f"/>
    <path d="M-16 -64 C-18 -94 16 -98 18 -66 C10 -56 -8 -56 -16 -64Z" fill="#111b2e"/>
    <ellipse cx="2" cy="-70" rx="8" ry="9" fill="#000"/>
    <circle cx="-1" cy="-71" r="1.7" fill="#ffe2a8"/><circle cx="6" cy="-71" r="1.7" fill="#ffe2a8"/>
    <path d="M14 -40 L54 -68" stroke="#2e2e3c" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="54" y1="-68" x2="56" y2="-56" stroke="#2e2e3c" stroke-width="2"/>
    <rect x="49" y="-56" width="14" height="18" rx="4" fill="#ffcf6a"/>
    <rect x="49" y="-56" width="14" height="18" rx="4" fill="#fff4c4" filter="url(#blur3)"/>
  </g>

  <!-- 떠다니는 빛 -->
  <g fill="#9ef2ff">
    <g filter="url(#blur3)">
      <circle cx="1120" cy="420" r="4"/><circle cx="1250" cy="360" r="3"/><circle cx="1440" cy="460" r="5"/>
      <circle cx="980" cy="300" r="3"/><circle cx="1180" cy="520" r="4"/><circle cx="1520" cy="380" r="3"/>
      <circle cx="880" cy="480" r="3"/><circle cx="1360" cy="250" r="4"/><circle cx="700" cy="420" r="3"/>
      <circle cx="1060" cy="560" r="3"/>
    </g>
    <circle cx="1120" cy="420" r="1.6"/><circle cx="1250" cy="360" r="1.2"/><circle cx="1440" cy="460" r="2"/>
    <circle cx="980" cy="300" r="1.2"/><circle cx="1180" cy="520" r="1.6"/><circle cx="1520" cy="380" r="1.2"/>
    <circle cx="880" cy="480" r="1.2"/><circle cx="1360" cy="250" r="1.6"/><circle cx="700" cy="420" r="1.2"/>
    <circle cx="1060" cy="560" r="1.2"/><circle cx="1300" cy="580" r="1.4"/><circle cx="820" cy="560" r="1.2"/>
  </g>

  <!-- 안개 -->
  <g fill="#bfe6ff" opacity=".07" filter="url(#blur24)">
    <ellipse cx="900" cy="640" rx="520" ry="40"/>
    <ellipse cx="1400" cy="600" rx="300" ry="30"/>
  </g>

  <rect width="1600" height="800" fill="url(#vignette)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2238"/>
      <stop offset="0.5" stop-color="#0a1828"/>
      <stop offset="1" stop-color="#03070e"/>
    </linearGradient>
    <radialGradient id="topLight" cx="0.5" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#a9d8ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a9d8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7aa8"/>
      <stop offset="1" stop-color="#14304c"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f0ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d8f0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6fbff" stop-opacity=".95"/>
      <stop offset="0.3" stop-color="#7fdcff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7fdcff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="titleGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#topLight)"/>

  <!-- 거대한 아치 창 -->
  <path d="M120 640 V330 Q120 160 300 100 Q480 160 480 330 V640Z" fill="#0b1b2d"/>
  <path d="M150 640 V340 Q150 196 300 140 Q450 196 450 340 V640Z" fill="url(#window)" opacity=".75"/>
  <g stroke="#0a1726" stroke-width="7" fill="none">
    <circle cx="300" cy="270" r="74"/>
    <circle cx="300" cy="270" r="30"/>
    <line x1="300" y1="196" x2="300" y2="640"/>
    <line x1="226" y1="270" x2="374" y2="270"/>
    <line x1="248" y1="218" x2="352" y2="322"/>
    <line x1="352" y1="218" x2="248" y2="322"/>
    <line x1="150" y1="420" x2="450" y2="420"/>
    <line x1="225" y1="344" x2="225" y2="640"/>
    <line x1="375" y1="344" x2="375" y2="640"/>
  </g>
  <polygon points="200,150 400,150 520,800 80,800" fill="url(#ray)"/>

  <!-- 기둥 -->
  <g fill="#060e18">
    <rect x="40" y="120" width="70" height="560"/><rect x="30" y="110" width="90" height="22"/>
    <rect x="490" y="120" width="70" height="560"/><rect x="480" y="110" width="90" height="22"/>
  </g>

  <!-- 늘어진 뿌리 -->
  <g stroke="#03070e" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M150 0 C140 60 170 90 154 160"/>
    <path d="M210 0 C220 40 196 70 206 110"/>
    <path d="M420 0 C430 70 400 110 418 190"/>
    <path d="M470 0 C462 30 480 50 468 86"/>
  </g>

  <!-- 바닥 -->
  <path d="M0 640 Q120 610 260 626 Q330 634 400 622 Q500 606 600 630 V800 H0Z" fill="#03070e"/>
  <!-- 부러진 기둥 -->
  <g fill="#050b14">
    <path d="M70 640 L70 560 L82 552 L92 566 L104 548 L110 560 L110 640Z"/>
    <rect x="500" y="600" width="60" height="22" transform="rotate(-12 530 611)"/>
  </g>
  <!-- 풀과 작은 꽃 -->
  <g fill="#03070e">
    <path d="M180 624 l4 -18 l3 18z"/><path d="M190 624 l6 -24 l3 24z"/><path d="M420 620 l4 -16 l3 16z"/>
    <path d="M430 620 l5 -22 l3 22z"/><path d="M540 626 l4 -18 l3 18z"/>
  </g>
  <g fill="#cfeaff">
    <circle cx="196" cy="600" r="3"/><circle cx="436" cy="598" r="3"/><circle cx="545" cy="608" r="2.5"/>
  </g>

  <!-- 푸른 등불을 든 방랑자 -->
  <g transform="translate(300 628)">
    <circle cx="44" cy="-62" r="80" fill="url(#lamp)"/>
    <path d="M-2 -70 C-20 -66 -30 -36 -34 0 L32 0 C28 -36 16 -66 -2 -70Z" fill="#050a14"/>
    <path d="M-16 -62 C-18 -92 16 -96 18 -64 C10 -54 -8 -54 -16 -62Z" fill="#0a1424"/>
    <ellipse cx="2" cy="-68" rx="8" ry="9" fill="#000"/>
    <circle cx="-1" cy="-69" r="1.6" fill="#e6fbff"/><circle cx="6" cy="-69" r="1.6" fill="#e6fbff"/>
    <path d="M14 -40 L42 -72" stroke="#1c2433" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="44" cy="-64" r="7" fill="#e6fbff"/>
    <circle cx="44" cy="-64" r="7" fill="#fff" filter="url(#blur2)"/>
  </g>

  <!-- 떠다니는 포자 -->
  <g fill="#d6efff">
    <g filter="url(#blur2)" opacity=".8">
      <circle cx="240" cy="420" r="4"/><circle cx="380" cy="380" r="3"/><circle cx="330" cy="500" r="4"/>
      <circle cx="180" cy="300" r="3"/><circle cx="420" cy="260" r="3"/><circle cx="260" cy="560" r="3"/>
      <circle cx="460" cy="470" r="4"/><circle cx="140" cy="460" r="3"/>
    </g>
    <circle cx="240" cy="420" r="1.5"/><circle cx="380" cy="380" r="1.2"/><circle cx="330" cy="500" r="1.5"/>
    <circle cx="180" cy="300" r="1.2"/><circle cx="420" cy="260" r="1.2"/><circle cx="260" cy="560" r="1.2"/>
    <circle cx="460" cy="470" r="1.5"/><circle cx="140" cy="460" r="1.2"/>
  </g>
  <!-- 빛 나비 -->
  <g fill="#9ee8ff" opacity=".9">
    <path d="M380 470 q-10 -12 -14 -2 q8 6 14 2 q10 -12 14 -2 q-8 6 -14 2z"/>
    <path d="M214 368 q-8 -10 -11 -2 q6 5 11 2 q8 -10 11 -2 q-6 5 -11 2z"/>
  </g>

  <!-- 제목 -->
  <g font-family="Georgia,'Times New Roman',serif" text-anchor="middle" fill="#eaf4ff">
    <line x1="120" y1="690" x2="480" y2="690" stroke="#8fbce0" stroke-width="1.5" opacity=".6"/>
    <text x="300" y="742" font-size="52" letter-spacing="8" filter="url(#titleGlow)">HOLLOW</text>
    <text x="300" y="782" font-size="26" letter-spacing="18" fill="#a9cdee">KNIGHT</text>
  </g>
</svg>

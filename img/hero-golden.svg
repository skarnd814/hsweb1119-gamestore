    <rect x="-20" y="10" width="36" height="110"/><polygon points="-26,10 -2,-36 22,10"/>
    <rect x="70" y="-20" width="44" height="140"/><polygon points="62,-20 92,-80 122,-20"/>
    <rect x="184" y="16" width="34" height="104"/><polygon points="178,16 201,-26 224,16"/>
    <rect x="130" y="20" width="26" height="100"/><polygon points="126,20 143,-10 160,20"/>
    <g fill="#1b1328">
      <rect x="16" y="30" width="10" height="12"/><rect x="36" y="30" width="10" height="12"/><rect x="56" y="30" width="10" height="12"/>
      <rect x="160" y="30" width="10" height="12"/>
    </g>
    <g fill="#ffb35a">
      <rect x="86" y="10" width="8" height="12"/><rect x="-6" y="40" width="6" height="10"/>
      <rect x="196" y="44" width="6" height="10"/><rect x="40" y="70" width="6" height="10"/><rect x="140" y="50" width="5" height="9"/>
    </g>

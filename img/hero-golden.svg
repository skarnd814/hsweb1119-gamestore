  <!-- 앞쪽 절벽 -->
  <path d="M0 640 Q240 610 480 628 T880 640 L1000 648 Q1060 660 1050 700 L1020 800 H0Z" fill="#0d0816"/>
  <path d="M1020 800 L1060 712 Q1200 690 1400 720 T1600 700 V800Z" fill="#0a0612"/>


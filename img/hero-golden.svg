      <circle cx="1300" cy="140" r="3"/><circle cx="980" cy="196" r="2"/><circle cx="1380" cy="190" r="2"/>
      <circle cx="1170" cy="100" r="2"/><circle cx="1430" cy="232" r="2"/><circle cx="920" cy="230" r="2"/>
    </g>

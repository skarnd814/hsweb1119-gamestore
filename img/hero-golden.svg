    <ellipse cx="900" cy="420" rx="5" ry="2.5" transform="rotate(20 900 420)"/>
    <ellipse cx="1040" cy="400" rx="6" ry="3" transform="rotate(40 1040 400)"/>
    <ellipse cx="820" cy="300" rx="4" ry="2" transform="rotate(-10 820 300)"/>
    <ellipse cx="1300" cy="380" rx="5" ry="2.5" transform="rotate(30 1300 380)"/>
    <ellipse cx="760" cy="460" rx="5" ry="2.5" transform="rotate(-40 760 460)"/>

    <path d="M1090 552 C1126 544 1148 522 1154 482 C1160 432 1148 384 1160 336 L1200 336 C1210 384 1200 432 1206 482 C1212 522 1236 544 1274 552Z" fill="url(#trunk)"/>
    <path d="M1150 520 C1120 536 1100 546 1060 552 L1110 552Z M1212 520 C1240 536 1262 546 1300 552 L1250 552Z" fill="#a26a22"/>

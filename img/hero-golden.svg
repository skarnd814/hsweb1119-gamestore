    <circle cx="610" cy="56" r="1.2"/><circle cx="780" cy="90" r="1.4"/><circle cx="1500" cy="70" r="1.4"/>
    <circle cx="1400" cy="30" r="1.1"/><circle cx="350" cy="180" r="1"/>
  </g>

  <!-- 황금 나무 빛 -->
  <ellipse cx="1180" cy="240" rx="520" ry="360" fill="url(#treeGlow)"/>


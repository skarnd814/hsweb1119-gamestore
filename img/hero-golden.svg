    <path d="M-10 -82 L10 -82 L14 -40 L12 0 L4 0 L2 -36 L-2 -36 L-4 0 L-12 0 L-14 -40Z"/>
    <circle cx="0" cy="-92" r="11"/>
    <path d="M-6 -102 L0 -116 L6 -102Z"/>
    <rect x="20" y="-70" width="3.5" height="70"/>
    <rect x="13" y="-72" width="18" height="4"/>
    <path d="M12 -70 L20 -66" stroke="#07040c" stroke-width="5"/>

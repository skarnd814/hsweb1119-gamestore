      <circle cx="1130" cy="164" r="62"/><circle cx="1200" cy="158" r="64"/><circle cx="1270" cy="168" r="60"/>
      <circle cx="1340" cy="192" r="56"/><circle cx="1402" cy="226" r="48"/><circle cx="1448" cy="256" r="36"/>
    </g>
    <g fill="url(#leafDark)">

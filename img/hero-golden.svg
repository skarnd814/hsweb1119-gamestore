<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0a22"/>
      <stop offset="0.35" stop-color="#2c2050"/>
      <stop offset="0.6" stop-color="#6b4466"/>
      <stop offset="0.82" stop-color="#cf9558"/>
      <stop offset="1" stop-color="#f2c983"/>
    </linearGradient>
    <radialGradient id="treeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd772" stop-opacity=".6"/>
      <stop offset="0.5" stop-color="#ffb84a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffb84a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.5" stop-color="#f9c54e"/>
      <stop offset="1" stop-color="#d98a1c"/>
    </radialGradient>
    <radialGradient id="leafDark" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#f6c75a"/>
      <stop offset="1" stop-color="#a8681a"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.5" stop-color="#e3a63c"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur30" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>

  <!-- 별 -->

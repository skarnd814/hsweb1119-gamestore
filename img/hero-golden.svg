  <path d="M0 470 L140 400 L260 440 L380 360 L520 430 L640 390 L760 450 L900 400 L1020 460 L1120 430 L1260 470 L1400 420 L1520 450 L1600 430 V800 H0Z" fill="#4c3462" opacity=".75"/>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06021a"/>
      <stop offset="0.5" stop-color="#1e0b40"/>
      <stop offset="0.85" stop-color="#4b1460"/>
      <stop offset="1" stop-color="#6a1a66"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe9fb"/>
      <stop offset="0.5" stop-color="#ff9be6"/>
      <stop offset="1" stop-color="#b03fd0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5fd6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff5fd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150630"/>
      <stop offset="1" stop-color="#05010c"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b6b" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff3b6b"/>
    </linearGradient>
    <linearGradient id="trail2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff7d6"/>
    </linearGradient>
    <pattern id="win" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="8" height="10" fill="#38e1ff" opacity=".5"/>
      <rect x="14" y="6" width="4" height="10" fill="#ff4fd8" opacity=".22"/>
    </pattern>
    <pattern id="win2" width="16" height="20" patternUnits="userSpaceOnUse">
      <rect x="3" y="5" width="6" height="8" fill="#ffd66b" opacity=".35"/>
    </pattern>
    <pattern id="rain" width="40" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <line x1="10" y1="0" x2="10" y2="28" stroke="#c4ecff" stroke-opacity=".22" stroke-width="1.3"/>
      <line x1="30" y1="44" x2="30" y2="62" stroke="#c4ecff" stroke-opacity=".15" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>

  <!-- 달 -->
  <circle cx="1180" cy="230" r="330" fill="url(#haze)"/>
  <circle cx="1180" cy="230" r="124" fill="url(#moon)"/>
  <g fill="#6a1a66" opacity=".35">
    <rect x="1040" y="250" width="280" height="6"/><rect x="1040" y="276" width="280" height="8"/><rect x="1040" y="306" width="280" height="10"/>
  </g>

  <!-- 하늘의 비행선 -->
  <g>
    <rect x="820" y="160" width="46" height="10" rx="5" fill="#2b1250"/>
    <circle cx="828" cy="165" r="2.5" fill="#38e1ff"/><circle cx="858" cy="165" r="2.5" fill="#ff4fd8"/>
    <rect x="1440" y="120" width="34" height="8" rx="4" fill="#2b1250"/>
    <circle cx="1446" cy="124" r="2" fill="#ffd66b"/>
  </g>

  <!-- 먼 스카이라인 -->
  <g fill="#1d0f3e">
    <rect x="0" y="380" width="70" height="320"/><rect x="60" y="320" width="56" height="380"/>
    <rect x="120" y="410" width="80" height="290"/><rect x="200" y="300" width="50" height="400"/>
    <rect x="260" y="360" width="90" height="340"/><rect x="350" y="420" width="60" height="280"/>
    <rect x="410" y="330" width="70" height="370"/><rect x="490" y="390" width="80" height="310"/>
    <rect x="580" y="280" width="60" height="420"/><rect x="650" y="370" width="90" height="330"/>
    <rect x="750" y="320" width="56" height="380"/><rect x="810" y="400" width="80" height="300"/>
    <rect x="900" y="290" width="70" height="410"/><rect x="980" y="360" width="60" height="340"/>
    <rect x="1050" y="400" width="90" height="300"/><rect x="1150" y="340" width="60" height="360"/>
    <rect x="1220" y="380" width="80" height="320"/><rect x="1310" y="300" width="56" height="400"/>
    <rect x="1370" y="370" width="90" height="330"/><rect x="1470" y="330" width="60" height="370"/>
    <rect x="1540" y="390" width="60" height="310"/>
    <rect x="598" y="240" width="4" height="40"/><rect x="918" y="250" width="4" height="40"/>
  </g>
  <g fill="url(#win2)" opacity=".7">
    <rect x="60" y="330" width="56" height="370"/><rect x="200" y="310" width="50" height="390"/>
    <rect x="580" y="290" width="60" height="410"/><rect x="900" y="300" width="70" height="400"/>
    <rect x="1310" y="310" width="56" height="390"/>
  </g>

  <!-- 중간 빌딩 -->
  <g fill="#110726">
    <rect x="30" y="460" width="130" height="240"/><rect x="180" y="420" width="110" height="280"/>
    <rect x="520" y="440" width="120" height="260"/><rect x="660" y="480" width="100" height="220"/>
    <rect x="1100" y="450" width="120" height="250"/><rect x="1240" y="410" width="110" height="290"/>
  </g>
  <g fill="url(#win)">
    <rect x="30" y="470" width="130" height="230"/><rect x="180" y="430" width="110" height="270"/>
    <rect x="520" y="450" width="120" height="250"/><rect x="1100" y="460" width="120" height="240"/>
    <rect x="1240" y="420" width="110" height="280"/>
  </g>

  <!-- 앞 빌딩 + 네온 간판 -->
  <g fill="#07030f">
    <rect x="780" y="400" width="190" height="320"/>
    <rect x="1360" y="260" width="240" height="460"/>
    <rect x="960" y="500" width="150" height="220"/>
    <rect x="0" y="560" width="120" height="160"/>
  </g>
  <g filter="url(#neon)">
    <rect x="1392" y="300" width="60" height="230" rx="6" fill="#1a0420" stroke="#ff2bd6" stroke-width="4"/>
    <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="40" fill="#ff9bee" text-anchor="middle">
      <text x="1422" y="350">N</text><text x="1422" y="400">E</text><text x="1422" y="450">O</text><text x="1422" y="500">N</text>
    </g>
    <rect x="800" y="430" width="150" height="56" rx="8" fill="#03141c" stroke="#2ee6ff" stroke-width="4"/>
    <text x="875" y="470" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#a8f5ff" text-anchor="middle" letter-spacing="3">ARCADE</text>
    <rect x="980" y="530" width="110" height="44" rx="8" fill="#1a1204" stroke="#ffd23f" stroke-width="4"/>
    <text x="1035" y="562" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#fff0a8" text-anchor="middle">24H</text>
    <line x1="1480" y1="560" x2="1580" y2="560" stroke="#2ee6ff" stroke-width="4"/>
    <line x1="1480" y1="590" x2="1550" y2="590" stroke="#ff2bd6" stroke-width="4"/>
  </g>
  <g fill="url(#win)" opacity=".5"><rect x="1470" y="280" width="120" height="250"/></g>

  <!-- 거리 -->
  <rect x="0" y="700" width="1600" height="100" fill="url(#street)"/>
  <g filter="url(#blur14)" opacity=".5">
    <rect x="1396" y="710" width="52" height="80" fill="#ff2bd6"/>
    <rect x="806" y="710" width="138" height="60" fill="#2ee6ff"/>
    <rect x="984" y="712" width="100" height="50" fill="#ffd23f"/>
  </g>
  <path d="M0 742 L1600 742" stroke="#2a1150" stroke-width="2"/>
  <!-- 차 불빛 궤적 -->
  <path d="M200 760 Q800 738 1600 752" stroke="url(#trail)" stroke-width="4" fill="none"/>
  <path d="M260 772 Q860 752 1600 766" stroke="url(#trail)" stroke-width="2.5" fill="none" opacity=".7"/>
  <path d="M0 728 Q700 714 1300 724" stroke="url(#trail2)" stroke-width="3" fill="none"/>

  <!-- 비 -->
  <rect width="1600" height="800" fill="url(#rain)"/>
</svg>

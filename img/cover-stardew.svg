<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55b0ec"/>
      <stop offset="0.5" stop-color="#a6daf5"/>
      <stop offset="0.7" stop-color="#fde6b4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3dc72"/><stop offset="1" stop-color="#7cc256"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ac552"/><stop offset="1" stop-color="#5aa83f"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1608" stop-opacity=".35"/>
    </linearGradient>
    <g id="sprout">
      <path d="M0 0 C-1 -8 -1 -14 0 -20" stroke="#3f8a2a" stroke-width="3" fill="none"/>
      <path d="M0 -12 C-10 -22 -19 -16 -17 -9 C-11 -6 -4 -8 0 -12Z" fill="#6cc04a"/>
      <path d="M0 -17 C8 -28 19 -22 17 -15 C11 -11 4 -13 0 -17Z" fill="#88d65c"/>
    </g>
    <g id="pumpkin">
      <ellipse cx="-11" cy="-12" rx="12" ry="12" fill="#e2701f"/>
      <ellipse cx="11" cy="-12" rx="12" ry="12" fill="#e2701f"/>
      <ellipse cx="0" cy="-13" rx="13" ry="14" fill="#f6923a"/>
      <path d="M-4 -12 Q0 -24 4 -12" stroke="#d0661c" stroke-width="2" fill="none"/>
      <rect x="-2" y="-31" width="4" height="8" rx="1" fill="#4d7a2a"/>
      <path d="M2 -27 q10 -6 14 2 q-8 -2 -14 -2z" fill="#6cc04a"/>
    </g>
  </defs>

  <rect width="600" height="800" fill="url(#sky)"/>

  <!-- 해 -->
  <circle cx="500" cy="250" r="120" fill="url(#sunGlow)"/>
  <circle cx="500" cy="250" r="42" fill="#fff3b0"/>

  <!-- 구름 -->
  <g fill="#fff">
    <g opacity=".95">
      <ellipse cx="110" cy="280" rx="58" ry="20"/><circle cx="90" cy="266" r="22"/><circle cx="126" cy="258" r="28"/>
    </g>
    <g opacity=".85">
      <ellipse cx="380" cy="320" rx="50" ry="15"/><circle cx="366" cy="308" r="18"/><circle cx="396" cy="304" r="22"/>
    </g>
  </g>

  <!-- 먼 산 -->
  <path d="M0 420 L70 370 L140 398 L230 340 L320 392 L400 356 L490 396 L560 362 L600 380 V500 H0Z" fill="#9db7dc"/>
  <path d="M230 340 L256 360 L240 358 L230 372 L214 356Z" fill="#fff" opacity=".8"/>

  <!-- 언덕 -->
  <path d="M0 450 Q150 410 300 438 T600 432 V560 H0Z" fill="url(#hill1)"/>
  <path d="M0 492 Q180 462 360 486 T600 480 V600 H0Z" fill="url(#hill2)"/>

  <!-- 농가 -->
  <g transform="translate(46 386)">
    <rect x="112" y="-14" width="16" height="40" fill="#8e4b2c"/>
    <g fill="#fff" opacity=".8">
      <circle cx="122" cy="-26" r="9"/><circle cx="132" cy="-44" r="12"/><circle cx="148" cy="-66" r="15"/>
    </g>
    <rect x="10" y="40" width="150" height="80" fill="#c98648"/>
    <g stroke="#a86c36" stroke-width="2">
      <line x1="10" y1="60" x2="160" y2="60"/><line x1="10" y1="80" x2="160" y2="80"/><line x1="10" y1="100" x2="160" y2="100"/>
    </g>
    <polygon points="-6,46 85,-6 176,46" fill="#c44a3f"/>
    <polygon points="-6,46 85,-6 85,6 4,50" fill="#a83a32"/>
    <rect x="70" y="72" width="30" height="48" rx="3" fill="#6b3d22"/>
    <circle cx="94" cy="98" r="2.5" fill="#f2c45a"/>
    <rect x="24" y="64" width="30" height="26" fill="#ffe79a" stroke="#6b3d22" stroke-width="3"/>
    <rect x="116" y="64" width="30" height="26" fill="#ffe79a" stroke="#6b3d22" stroke-width="3"/>
    <line x1="39" y1="64" x2="39" y2="90" stroke="#6b3d22" stroke-width="2"/>
    <line x1="131" y1="64" x2="131" y2="90" stroke="#6b3d22" stroke-width="2"/>
  </g>

  <!-- 사과나무 -->
  <g>
    <rect x="490" y="420" width="18" height="90" fill="#7a4a2a"/>
    <circle cx="500" cy="400" r="58" fill="#3f8a30"/>
    <circle cx="456" cy="424" r="38" fill="#4f9a3a"/>
    <circle cx="546" cy="424" r="40" fill="#4f9a3a"/>
    <circle cx="496" cy="368" r="40" fill="#5fb045"/>
    <g fill="#e2423a">
      <circle cx="470" cy="400" r="6"/><circle cx="520" cy="384" r="6"/><circle cx="540" cy="420" r="6"/>
      <circle cx="490" cy="430" r="6"/><circle cx="458" cy="430" r="5"/>
    </g>
  </g>

  <!-- 닭 -->
  <g transform="translate(262 508)">
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="#fff"/>
    <path d="M-12 -4 L-22 -12 L-16 2Z" fill="#f2f2f2"/>
    <circle cx="12" cy="-10" r="7" fill="#fff"/>
    <path d="M10 -18 q2 -5 4 0 q2 -5 4 0z" fill="#e2423a"/>
    <path d="M18 -10 L24 -8 L18 -6Z" fill="#f2a33a"/>
    <circle cx="14" cy="-11" r="1.4" fill="#222"/>
    <path d="M-3 10 L-3 16 M4 10 L4 16" stroke="#f2a33a" stroke-width="2"/>
  </g>

  <!-- 밭 -->
  <polygon points="118,520 507,520 1150,800 -450,800" fill="#9c6638"/>
  <g fill="#86552d">
    <polygon points="166,520 215,520 -50,800 -250,800"/>
    <polygon points="264,520 312,520 350,800 150,800"/>
    <polygon points="361,520 409,520 750,800 550,800"/>
    <polygon points="458,520 507,520 1150,800 950,800"/>
  </g>
  <rect x="0" y="520" width="600" height="280" fill="url(#shade)"/>

  <!-- 작물 -->
  <use href="#sprout" transform="translate(54 572) scale(.6)"/>
  <use href="#sprout" transform="translate(205 572) scale(.6)"/>
  <use href="#sprout" transform="translate(357 572) scale(.6)"/>
  <use href="#sprout" transform="translate(508 572) scale(.6)"/>
  <use href="#sprout" transform="translate(553 604) scale(.75)"/>
  <use href="#sprout" transform="translate(158 642) scale(.95)"/>
  <use href="#pumpkin" transform="translate(385 644) scale(.9)"/>
  <use href="#sprout" transform="translate(97 734) scale(1.4)"/>
  <use href="#pumpkin" transform="translate(424 736) scale(1.5)"/>

  <!-- 울타리 -->
  <g>
    <g fill="#8a5a32">
      <rect x="10" y="488" width="9" height="40"/><rect x="58" y="490" width="9" height="40"/>
      <rect x="106" y="492" width="9" height="40"/>
    </g>
    <g fill="#b07a44">
      <rect x="0" y="498" width="124" height="6"/><rect x="0" y="514" width="124" height="6"/>
    </g>
  </g>

  <!-- 제목 -->
  <g font-family="'Trebuchet MS','Arial Black',Arial,sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round">
    <text x="300" y="118" font-size="76" fill="#3a1d0c" opacity=".35">STARDEW</text>
    <text x="300" y="112" font-size="76" fill="#fff6dc" stroke="#6b3a1e" stroke-width="12" paint-order="stroke" letter-spacing="2">STARDEW</text>
    <text x="300" y="190" font-size="62" fill="#ffd36a" stroke="#6b3a1e" stroke-width="11" paint-order="stroke" letter-spacing="6">VALLEY</text>
  </g>
